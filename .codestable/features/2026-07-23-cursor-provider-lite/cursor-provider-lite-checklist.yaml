feature: 2026-07-23-cursor-provider-lite
created: 2026-07-23
steps:
- id: S1
  action: 外部契约与编排骨架：固定 Pi 0.81.1/Cursor SDK 1.0.24 公开类型并注册 cursor-lite/auto
  exit_signal: typecheck 无 deep import/private shape；无 key 不触网，隔离 Pi offline dummy
    credential 可见 cursor-lite/auto
  status: done
- id: S2
  action: 纯计算节点：实现 auth/model-id/mode、catalog、CursorLiteError 和 PiContextEnvelopeV1
    投影
  exit_signal: 目录 merge/失败、id 原样映射、模式、正向多轮/边界注入、图片/未知 part 和错误清洗测试全部通过
  status: done
- id: S3
  action: 外部适配节点：接通 one-shot Cursor Agent、onDelta projector 与 Pi AssistantMessageEventStream
  exit_signal: 完整 async stream 的 start/block/delta/terminal/end、reasoning=false thinking
    probe、usage/identity、tool ignore、partial error/fallback 测试通过
  status: done
- id: S4
  action: 运行硬化：按 P0-P4 实现 abort、并发隔离、temp 权限、cancel/dispose timeout、删除重试和终态矩阵
  exit_signal: pre/create/run/finished 竞态及 cleanup 组合测试符合矩阵；cleanup failure 返回 residual，test
    harness 完成二次清理
  status: done
- id: S5
  action: 用户文档：说明认证优先级、进程级 mode、数据发送、成本/usage、工具审计、安全/平台/one-shot 和凭证清除边界
  exit_signal: README/manifest 自动断言覆盖所有用户可见边界，未把零 cost 写成免费或把 plan 写成安全隔离
  status: done
- id: S6
  action: 发布与功能卸载：验证 package 预算、依赖/import/call allowlist、packed install 和隔离 Pi load/unload
  exit_signal: packed wrapper 在空目录可安装加载；未加载时 Provider/listener 消失；wrapper 文件数/大小与生产依赖符合预算
  status: done
- id: S7
  action: 真实模型目录：用 owner 环境 key 从 packed wrapper 触发 Pi refresh 并核对公共模型列表
  exit_signal: auto 固定第一，其余按 SDK 首次出现顺序稳定去重；空项过滤，斜杠 id 保留可选择
  status: done
- id: S8
  action: 真实运行 smokes：在 disposable git fixture 验证 plan/context 结构、ambient config probe
    和 agent canary edit
  exit_signal: plan/context 结构合法，ambient hooks/subagents probe 与 README 一致，agent 仅有
    canary diff，fixture/temp/进程/证据清理
  status: done
checks:
- id: C01
  item: Provider/auth namespace 为 cursor-lite；static auto、allowNetwork=false、无 key
    和动态目录行为符合 SC-01/SC-02
  source: design §1.4/decision-1,5,9; §3.1/SC-01,SC-02
  status: done
- id: C02
  item: PI_CURSOR_MODE 是进程级输入，每请求快照；缺失为 plan，仅接受 plan|agent，非法值在 Agent.create 前失败
  source: design §0/运行模式; §3.1/SC-04
  status: done
- id: C03
  item: session_start 是唯一 event hook且只更新 cwd；每请求独立 Agent/store/run/listener，不复用或恢复
    SDK 会话
  source: design §2.2/流程级约束; §2.3/挂载点; §3.1/SC-13
  status: done
- id: C04
  item: Pi stream 严格 start→block deltas→done/error→end；reasoning=false thinking probe、partial、usage/cost、model/request
    id 均按表映射
  source: design §2.1/Pi stream 协议; §3.1/SC-03,SC-08
  status: done
- id: C05
  item: P0-P4 与 primary×cleanup 矩阵覆盖 pre-abort/create/run/竞态/cancel/dispose/delete
    failure；terminal 在 cleanup settle 后
  source: design §2.2/资源获取与终态矩阵; §3.1/SC-06
  status: done
- id: C06
  item: projector 仅输出 text/thinking；不注入 MCP/customTools/agents/settingSources；poison
    probe 记录 hooks/subagents 默认行为且 README 一致
  source: design §1.4/decision-3,8; §2.1/Test surface; §3.1/SC-05
  status: done
- id: C07
  item: runtime 无 Cloud、resume/pool、MCP bridge、replay renderer、配置 UI、slash command、额外
    Pi tool 或模型缓存
  source: design §1.1/明确不做; §3.2
  status: done
- id: C08
  item: PiContextEnvelopeV1 确定性 JSON 保持 system/消息/text 顺序，不写 thinking/tool args；image/未知
    part 在 stringify 前失败
  source: design §2.1/PiContextEnvelopeV1; §3.1/SC-09,SC-10
  status: done
- id: C09
  item: 对外错误是单行 bounded CURSOR_LITE_<CODE> 字符串；sanitizer 不序列化 cause/stack/details并清洗
    key/prompt/temp/control chars
  source: design §2.1/CursorLiteError; §2.2/错误映射; §3.1/SC-07
  status: done
- id: C10
  item: 功能卸载移除 package/Provider/hook；README 指引 /logout→选择 cursor-lite/Cursor Lite→验证
    auth entry 清除，不自动删凭证
  source: requirement/用户故事与边界; design §3.1/SC-11,SC-14
  status: done
- id: C11
  item: README 明示 Local Agent 非本地模型、数据发送、ambient hooks/subagents 默认、plan 非安全边界、agent
    直接修改和 Pi 审计缺口
  source: requirement/边界; design §1.5; §3.1/SC-14,SC-15
  status: done
- id: C12
  item: manifest 固定 package/type/private/files/Node>=22.19/SDK/Pi peer+dev/entry/token
    估算；npm pack --json 证明 wrapper <=12 文件/150 KiB
  source: design §1.4/decision-10; §2.5/Manifest; §3.1/SC-12
  status: done
- id: C13
  item: catalog callback 无 custom state；offline/no-key/非 api_key credential 返回 auto
    且不触网，联网成功 merge auto，失败/空目录 throw
  source: design §2.2/流程级约束; §3.1/SC-01,SC-02
  status: done
- id: C14
  item: SDK usage 逐字段复制并断言 total 等于前四项之和，reasoning 是 output 子集；未报告 usage/未知价格用必填零值并解释
  source: design §2.1/Cursor SDK 与 Pi stream 表; §3.1/SC-03
  status: done
- id: C15
  item: 双并发请求拥有不同 Agent/store/sink/listener；取消一个不影响另一个且双方按独立矩阵清理
  source: design §1.2/Concurrency; §3.1/SC-13
  status: done
- id: C16
  item: Pi Model.id 等于 Cursor canonical id，CLI 才显示 provider/id；传 SDK 时 model.id 原样保留，包括
    auto 和斜杠 id
  source: design §1.4/decision-1; §3.1/SC-02
  status: done
- id: C17
  item: auth 顺序由 Pi 决定：--api-key→auth.json[cursor-lite]→CURSOR_API_KEY→models.json；stream/catalog
    只消费 Pi resolved value
  source: design §0/Pi resolved auth; §1.4/decision-9
  status: done
- id: C18
  item: temp root 由 mkdtemp 创建、POSIX 0700、Windows 使用用户 temp ACL；删除固定重试，residual 只给安全通配清理建议
  source: design §2.2/P1-P4; §3.1/SC-06,SC-14
  status: done
- id: C19
  item: production 只从 @cursor/sdk root 使用 Cursor/Agent/JsonlLocalAgentStore 等公开 symbols，固定
    .d.ts 通过 typecheck，不 deep-import/shape-guess
  source: design §2.1/Cursor SDK 1.0.24 契约表
  status: done
- id: C20
  item: scripts 用 process.execPath+resolved Pi bin JS、shell:false 与隔离 HOME/USERPROFILE/config/temp/disposable
    fixture；缺 key 退出 2 报 BLOCKED
  source: design §3.4/Validation Commands
  status: done
